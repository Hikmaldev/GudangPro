version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gudangpro-sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=GudangPro@2026!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'GudangPro@2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gudangpro-backend
    restart: always
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=GudangProDb;User Id=sa;Password=GudangPro@2026!;TrustServerCertificate=True;MultipleActiveResultSets=True;
      - JwtSettings__Secret=GudangProSuperSecretKey2026Minimal32CharsLong!
      - JwtSettings__Issuer=GudangPro
      - JwtSettings__Audience=GudangProClient
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gudangpro-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mssql_data:
