<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gudangBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    
    <!-- Accent Gradient for rightmost bar -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Blue Gradient for center bar -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Cyan Gradient for left bar -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Modern App Icon Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#gudangBg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Warehouse Gable Roof -->
  <path d="M14 26 L32 14 L50 26" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Inventory Stock Growth Bars (Signature GudangPro 3-bar mark) -->
  <rect x="19" y="35" width="6" height="14" rx="3" fill="url(#cyanGrad)" />
  <rect x="29" y="28" width="6" height="21" rx="3" fill="url(#blueGrad)" />
  <rect x="39" y="21" width="6" height="28" rx="3" fill="url(#emeraldGrad)" />

  <!-- Warehouse Foundation Floor -->
  <path d="M16 52.5 L48 52.5" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round" />
</svg>
